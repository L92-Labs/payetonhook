name = "payetonhook-worker"
account_id = "5d31bf258cf5c8d334f684feb7797e97"
main = "src/index.ts"
compatibility_date = "2025-02-01"
workers_dev = false

routes = [
  { pattern = "api.payetonhook.l92-labs.com", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "payetonhook"
database_id = "e3b9aa11-fe00-4196-b87b-ea442f74f8a4"

[[r2_buckets]]
binding = "EVENT_BLOB"
bucket_name = "payetonhook-events"

[[queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "payetonhook-webhook-queue"

[[queues.consumers]]
queue = "payetonhook-webhook-queue"
max_batch_size = 10
max_batch_timeout = 5

[[durable_objects.bindings]]
name = "TUNNEL_HUB"
class_name = "TunnelHub"

[[durable_objects.bindings]]
name = "DEMO_HUB"
class_name = "DemoRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TunnelHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DemoRoom"]

[triggers]
crons = ["0 * * * *"]

[observability.logs]
enabled = false
invocation_logs = true

[vars]
DUAL_WRITE_ENABLED = "false"
READ_SOURCE = "d1"
GOOGLE_CLIENT_ID = "657803018014-i22ghjh6ft77so1lcet5uj6lfludrvr1.apps.googleusercontent.com"
AUTH_REDIRECT_URI = "https://api.payetonhook.l92-labs.com/auth/google/callback"
DASHBOARD_ORIGINS = "https://payetonhook.l92-labs.com"
RATE_LIMIT_PER_MINUTE_PROJECT = "1200"
RATE_LIMIT_PER_MINUTE_IP = "240"
ALERT_WEBHOOK_URL = ""
ALERT_MIN_INTERVAL_MS = "300000"
RETENTION_SWEEP_BATCH_SIZE = "250"
